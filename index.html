<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Proveedores de matrimonio</title>
<style>
  :root {
    --bg: #fdf6f7; --surface: #ffffff; --ink: #2a2228; --muted: #6e5f68; --line: #f0dfe4;
    --accent: #b03a63; --accent-soft: #f9e4ea; --star: #a87a0a; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1720; --surface: #28202b; --ink: #f6eef2; --muted: #b9a8b2; --line: #3d3040;
      --accent: #f08bab; --accent-soft: #3d2431; --star: #f2c230;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 32px 16px 16px; max-width: 1200px; margin: 0 auto; }
  h1 { font: 600 32px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0; }
  .estado { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .estado summary { cursor: pointer; }
  .estado ul { columns: 220px; margin: 8px 0 0; padding: 0; list-style: none; }
  .estado li { padding: 2px 0; break-inside: avoid; }
  .estado b { color: var(--ink); font-weight: 600; }
  .filtros { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .filtros-in { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input[type=search] { flex: 1 1 220px; }
  .cuenta { color: var(--muted); font-size: 14px; margin-left: auto; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .grilla { display: flex; flex-direction: column; gap: 16px; }
  .pagina { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; text-align: left; padding: 0; font: inherit; color: inherit; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .card-wrap { position: relative; display: flex; }
  .card-wrap .card { width: 100%; }
  .corazon { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,.92); color: var(--accent); font-size: 19px; line-height: 1; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .det-head .corazon { position: static; flex: none; background: var(--accent-soft); box-shadow: none; }
  .card .foto { aspect-ratio: 3/2; background: var(--accent-soft); width: 100%; object-fit: cover; display: block; }
  .card .cuerpo { padding: 16px 16px 18px; }
  .card h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.3; }
  .meta { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .meta + .meta { margin-top: 4px; }
  .det-head h2 + .meta { margin-top: 8px; }
  .estrellas { color: var(--star); letter-spacing: 1px; }
  .precio { margin-top: 10px; font-size: 14px; color: var(--accent); font-weight: 600; }
  [hidden] { display: none !important; }
  .vacio { text-align: center; color: var(--muted); padding: 64px 16px; }
  dialog { border: none; border-radius: var(--radius); padding: 0; width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(20,15,10,.55); }
  .det-head { padding: 20px 24px 8px; display: flex; gap: 16px; align-items: flex-start; }
  .det-head h2 { margin: 0; font: 600 26px/1.2 Georgia, serif; flex: 1; }
  .cerrar { border: none; background: var(--accent-soft); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; }
  .galeria { display: flex; gap: 8px; overflow-x: auto; padding: 8px 24px; scroll-snap-type: x mandatory; }
  .cargando { background: linear-gradient(90deg, var(--accent-soft) 30%, var(--line) 50%, var(--accent-soft) 70%) 0 0 / 300% 100%; animation: brillo 1.4s linear infinite; }
  @keyframes brillo { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .cargando { animation: none; } }
  .card .sin-fotos, .sin-fotos { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .galeria img { height: 260px; aspect-ratio: 3/2; object-fit: cover; border-radius: 8px; background: var(--accent-soft); scroll-snap-align: start; flex: none; }
  section.bloque { padding: 8px 24px 16px; }
  section.bloque h4 { margin: 16px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .descripcion { white-space: pre-line; }
  .faq { margin: 0; }
  .faq dt { font-weight: 600; margin-top: 10px; }
  .faq dd { margin: 4px 0 0; color: var(--muted); }
  .opinion { border-top: 1px solid var(--line); padding: 14px 0; }
  .opinion > div + div { margin-top: 4px; }
  .opinion .quien { font-weight: 600; }
  .links a { color: var(--accent); margin-right: 16px; }
  .ruta { color: var(--accent); font-weight: 600; text-decoration: none; padding: 8px 4px; white-space: nowrap; }
  .opciones { display: contents; }
  .filtro-btn { display: none; position: relative; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .insignia { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  @media (max-width: 700px) {
    .filtro-btn { display: inline-flex; }
    .opciones { display: none; flex-basis: 100%; flex-direction: column; align-items: stretch; gap: 8px; padding-top: 4px; }
    .opciones.abierto { display: flex; }
    #categoria { flex: 1 1 140px; min-width: 0; }
    .opciones:not(.abierto) ~ .cuenta { display: none; }
  }
  .pista { position: fixed; inset: auto 16px 96px 16px; z-index: 5; margin: 0 auto; max-width: 360px; padding: 12px 16px; border-radius: var(--radius); background: var(--ink); color: var(--bg); font-size: 14px; text-align: center; pointer-events: none; }
  .filtros-in.solo-rutas > :not(.ruta) { display: none; }
  .chip { position: absolute; top: 10px; left: 10px; pointer-events: none; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--accent); }
  .card-wrap.descartado .card { opacity: .5; }
  dialog { overflow: auto; overscroll-behavior: contain; }
  .ficha { position: relative; background: var(--surface); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .ficha.volando { transition: transform .25s ease-in; }
  .ficha.volviendo { transition: transform .2s ease-out; }
  .sello { position: absolute; top: 28px; z-index: 3; padding: 4px 14px; border: 3px solid; border-radius: 8px; font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .06em; opacity: 0; pointer-events: none; background: var(--surface); }
  .sello-no { right: 24px; color: var(--muted); transform: rotate(12deg); }
  .sello-si { left: 24px; color: var(--accent); transform: rotate(-12deg); }
  .mas-info summary { display: inline-block; margin-top: 16px; padding: 8px 18px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-weight: 600; cursor: pointer; list-style: none; }
  .mas-info summary::-webkit-details-marker { display: none; }
  .mas-info[open] summary { display: none; }
  .ficha.desde-abajo { animation: entrar-abajo .22s ease-out; }
  .ficha.desde-arriba { animation: entrar-arriba .22s ease-out; }
  @keyframes entrar-abajo { from { transform: translateY(40px); opacity: 0; } }
  @keyframes entrar-arriba { from { transform: translateY(-40px); opacity: 0; } }
  @media (hover: none) { .acciones .navegar { display: none; } }
  @media (prefers-reduced-motion: reduce) { .ficha.desde-abajo, .ficha.desde-arriba { animation: none; } }
  .posicion { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .acciones { position: sticky; bottom: 0; z-index: 4; display: flex; justify-content: center; gap: 20px; padding: 16px; background: linear-gradient(transparent, var(--surface) 35%); }
  .acciones button { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 24px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .acciones [data-accion="presupuesto"], .acciones [data-accion="favorito"] { color: var(--accent); }
  .pop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 120px; color: var(--accent); pointer-events: none; opacity: 0; z-index: 5; }
  .pop.on { animation: pop .7s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: .95; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .pop.on { animation: none; } .ficha.volando, .ficha.volviendo { transition: none; } }
  .aviso { inset: auto 0 24px 0; margin: 0 auto; width: fit-content; max-width: calc(100vw - 32px); border: none; border-radius: 999px; padding: 10px 12px 10px 20px; background: var(--ink); color: var(--bg); display: none; align-items: center; gap: 16px; font-size: 15px; }
  .aviso:popover-open { display: flex; }
  .aviso button { font: inherit; font-weight: 700; color: var(--accent); background: none; border: none; cursor: pointer; padding: 4px 8px; }
  .presupuesto h2 { font: 600 22px/1.2 Georgia, serif; margin: 24px 0 12px; }
  .item-p { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .item-p h3 { margin: 0 0 4px; font-size: 17px; }
  .item-p .ver { font: inherit; font-weight: 600; color: var(--ink); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  .item-p .precio { margin-top: 4px; }
  .contacto { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
  .contacto a { color: var(--accent); }
  .quitar { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  @media (max-width: 600px) {
    dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; }
    .galeria img { height: 220px; }
  }
</style>
</head>
<body>
<header>
  <h1>Proveedores de matrimonio</h1>
  <p class="sub">Fichas de matrimonios.cl rescatadas de Wayback Machine (capturas 2025). Las fotos cargan desde el archivo, así que necesitan internet.</p>
  <details class="estado" id="estado"></details>
</header>
<div class="filtros"><div class="filtros-in" id="barra">
  <a class="ruta" id="ir-favoritos"></a>
  <a class="ruta" id="ir-presupuesto"></a>
  <select id="categoria"></select>
  <button class="filtro-btn" id="filtro-btn" aria-expanded="false" aria-controls="opciones" aria-label="Filtros">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
    <span class="insignia" id="insignia" hidden></span>
  </button>
  <div class="opciones" id="opciones">
  <input id="buscar" type="search" placeholder="Buscar por nombre, comuna o descripción…">
  <select id="region"><option value="">Todas las zonas</option></select>
  <select id="nota">
    <option value="0">Cualquier nota</option><option value="4.5">4.5+</option><option value="4.8">4.8+</option><option value="5">5.0</option>
  </select>
  <select id="fotos">
    <option value="">Con y sin fotos</option><option value="con">Con fotos</option><option value="sin">Sin fotos</option>
  </select>
  <select id="orden">
    <option value="opiniones">Más opiniones</option><option value="nota">Mejor nota</option><option value="nombre">Nombre A–Z</option>
  </select>
  <select id="decision">
    <option value="">Ocultar descartados</option><option value="pendientes">Solo sin decidir</option><option value="todos">Todos, con descartados</option>
  </select>
  </div>
  <span class="cuenta" id="cuenta"></span>
</div></div>
<main>
  <div class="grilla" id="grilla"></div>
  <div class="presupuesto" id="presupuesto" hidden></div>
  <p class="vacio" id="vacio" hidden></p>
  <div id="fin"></div>
</main>
<dialog id="detalle"></dialog>
<div class="aviso" id="aviso" popover="manual"><span id="aviso-texto"></span><button id="deshacer">Deshacer</button></div>
<script>
const GRUPOS = {
  "Lugar": { "centros-de-eventos": "Centros de eventos", "casona-de-eventos": "Casonas", "parcela-de-eventos": "Parcelas", "hoteles-matrimonios": "Hoteles", "restaurantes-matrimonios": "Restaurantes", "salones-eventos": "Salones", "locales-eventos": "Locales", "espacios-singulares": "Espacios singulares", "carpas-de-eventos": "Carpas", "bodas-en-la-playa": "Bodas en la playa", "destination-wedding": "Destination wedding", "lugares-matrimonios": "Otros lugares" },
  "Banquete": { "banquetes": "Banquetes", "torta-novios": "Tortas", "food-truck-y-mesas-de-dulces": "Food trucks y dulces", "barras-moviles": "Barras móviles" },
  "Foto y video": { "fotografo-matrimonio": "Fotógrafos", "video-matrimonio": "Video", "photobooth": "Photobooth" },
  "Novia": { "tiendas-de-novia": "Vestidos de novia", "accesorios-novia": "Accesorios de novia", "belleza-novias": "Belleza y maquillaje" },
  "Novio": { "trajes-novio": "Trajes de novio", "accesorios-novio": "Accesorios de novio", "cuidado-masculino": "Cuidado masculino" },
  "Fiesta": { "musica-matrimonio": "Música", "animacion-de-eventos": "Animación", "decoracion-matrimonio": "Decoración", "florerias": "Florerías", "cotillon": "Cotillón" },
  "Detalles": { "wedding-planner": "Wedding planners", "invitaciones-matrimonio": "Invitaciones", "argollas-de-matrimonio": "Argollas", "autos-matrimonio": "Autos", "recuerdos-matrimonios": "Recuerdos", "trajes-fiesta": "Trajes de fiesta", "trajes-madrina": "Trajes de madrina", "luna-de-miel": "Luna de miel" },
};
const CATEGORIAS = Object.assign({}, ...Object.values(GRUPOS));
const POR_PAGINA = 24;
const ARCHIVO = "https://web.archive.org/web/";
const R2 = "https://pub-95b399b3450e4eb29238ae65c72a02e5.r2.dev";
const CATEGORIA_INICIAL = "musica-matrimonio";
const FILTROS = ["buscar", "region", "nota", "fotos", "orden", "decision"];
const RUTAS = { "#favoritos": "favoritos", "#presupuesto": "presupuesto" };
const SEGUNDOS_DESHACER = 5;
const DOBLE_TOQUE_MS = 300;
const INICIO_ARRASTRE_PX = 12;

const datos = {};
let lista = [];
let mostrados = 0;
const MARGEN_PX = 1500;
const $ = (id) => document.getElementById(id);

let estado = {};
let filtrosGuardados = {};
let actualizado = "";
const MARCAS = { favoritos: leerMarca("favoritos"), presupuesto: leerMarca("presupuesto"), descartados: leerMarca("descartados") };
window.CATALOGO = {
  agregar(cat, proveedores) { datos[cat] = proveedores; },
  estado(porCategoria, fecha) { estado = porCategoria; actualizado = fecha; },
};

function leerMarca(clave) {
  try { return new Set(JSON.parse(localStorage.getItem(clave)) || []); } catch { return new Set(); }
}

function guardarMarca(clave) {
  try { localStorage.setItem(clave, JSON.stringify([...MARCAS[clave]])); } catch {}
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function urlFoto(ref) {
  const corte = ref.indexOf("/");
  return `${ARCHIVO}${ref.slice(0, corte)}im_/https://cdn0.matrimonios.cl/${ref.slice(corte + 1)}`;
}

function urlR2(p, archivo) {
  return `${R2}/${categoriaDe(p.url)}/${p.url.match(/--e(\d+)/)[1]}/${archivo}`;
}

function imgFoto(src, clase) {
  return `<img class="${clase} cargando" loading="lazy" alt="" draggable="false" src="${src}">`;
}

function sinFotos(texto) {
  return `<div class="foto sin-fotos">${texto}</div>`;
}

document.addEventListener("load", (e) => e.target.classList?.remove("cargando"), true);
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName !== "IMG") return;
  if (img.classList.contains("foto")) img.outerHTML = sinFotos("Foto no disponible");
  else img.remove();
}, true);

function estrellas(nota) {
  const n = Math.round(Number(nota) || 0);
  return "★".repeat(n) + "☆".repeat(5 - n);
}

function cargarScript(src) {
  return new Promise((ok) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = s.onerror = ok;
    document.head.appendChild(s);
  });
}

async function cargar(cat) {
  if (!datos[cat] && estado[cat]) await cargarScript(`data/${cat}.js?v=${encodeURIComponent(actualizado)}`);
  return datos[cat] || null;
}

function avance(cat) {
  const e = estado[cat];
  if (!e) return "pendiente";
  if (!e.total) return `${e.listos} listos`;
  return e.listos >= e.total ? `${e.listos} ✓` : `${e.listos} de ${e.total}`;
}

function pintarEstado() {
  const conDatos = Object.keys(estado);
  const proveedores = conDatos.reduce((n, c) => n + estado[c].listos, 0);
  const filas = Object.entries(CATEGORIAS)
    .sort((a, b) => (estado[b[0]] ? 1 : 0) - (estado[a[0]] ? 1 : 0) || a[1].localeCompare(b[1], "es"))
    .map(([k, v]) => `<li>${estado[k] ? `<b>${v}</b>` : v} · ${avance(k)}</li>`).join("");
  $("estado").innerHTML = `<summary>Descarga en curso: ${conDatos.length} de ${Object.keys(CATEGORIAS).length} categorías con datos · ${proveedores.toLocaleString("es-CL")} proveedores${actualizado ? ` · actualizado ${esc(actualizado)}` : ""}</summary><ul>${filas}</ul>`;
}

function categoriaDe(url) {
  return new URL(url).pathname.split("/")[1];
}

function vista() {
  return RUTAS[location.hash] || "catalogo";
}

function oculto(p) {
  if (vista() !== "catalogo") return false;
  const decision = $("decision").value;
  if (decision === "pendientes") return MARCAS.presupuesto.has(p.url) || MARCAS.descartados.has(p.url);
  return decision !== "todos" && MARCAS.descartados.has(p.url);
}

function proveedoresDe() {
  const v = vista();
  if (v === "catalogo") return datos[$("categoria").value];
  return Object.values(datos).flat().filter((p) => MARCAS[v].has(p.url));
}

function pintarRutas() {
  const v = vista();
  $("ir-favoritos").href = v === "favoritos" ? "#" : "#favoritos";
  $("ir-favoritos").textContent = v === "favoritos" ? "← Todo el catálogo" : `♥ Favoritos · ${MARCAS.favoritos.size}`;
  $("ir-presupuesto").href = v === "presupuesto" ? "#" : "#presupuesto";
  $("ir-presupuesto").textContent = v === "presupuesto" ? "← Todo el catálogo" : `＄ Mi presupuesto · ${MARCAS.presupuesto.size}`;
}

function corazon(p) {
  const on = MARCAS.favoritos.has(p.url);
  return `<button class="corazon" data-url="${esc(p.url)}" aria-pressed="${on}" aria-label="${on ? "Quitar de" : "Agregar a"} favoritos">${on ? "♥" : "♡"}</button>`;
}

function alternarFavorito(url) {
  if (MARCAS.favoritos.has(url)) MARCAS.favoritos.delete(url); else MARCAS.favoritos.add(url);
  guardarMarca("favoritos");
  document.querySelectorAll(".corazon").forEach((b) => {
    if (b.dataset.url === url) b.outerHTML = corazon({ url });
  });
  const boton = document.querySelector('.acciones [data-accion="favorito"]');
  if (boton) boton.textContent = MARCAS.favoritos.has(url) ? "♥" : "♡";
  pintarRutas();
}

async function mostrar() {
  const v = vista();
  pintarRutas();
  $("barra").classList.toggle("solo-rutas", v === "presupuesto");
  $("categoria").hidden = v !== "catalogo";
  $("decision").hidden = v !== "catalogo";
  if (v === "catalogo") {
    try { localStorage.setItem("categoria", $("categoria").value); } catch {}
    await cargar($("categoria").value);
  } else {
    await Promise.all([...new Set([...MARCAS[v]].map(categoriaDe))].map(cargar));
  }
  const enPresupuesto = v === "presupuesto";
  $("presupuesto").hidden = !enPresupuesto;
  $("grilla").hidden = enPresupuesto;
  if (enPresupuesto) return pintarPresupuesto();
  const provs = proveedoresDe();
  const regiones = [...new Set((provs || []).map((p) => p.region).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
  $("region").innerHTML = `<option value="">Todas las zonas</option>` + regiones.map((r) => `<option>${esc(r)}</option>`).join("");
  $("region").value = filtrosGuardados.region || "";
  filtrar();
}

function vaciar(mensaje) {
  lista = [];
  reiniciarGrilla();
  $("vacio").hidden = false;
  $("vacio").textContent = mensaje;
  $("cuenta").textContent = "";
}

function pintarInsignia() {
  const activos = [$("buscar").value.trim(), $("region").value, $("nota").value !== "0", $("fotos").value, $("decision").value].filter(Boolean).length;
  $("insignia").hidden = !activos;
  $("insignia").textContent = activos;
}

function filtrar() {
  pintarInsignia();
  const provs = proveedoresDe();
  if (vista() === "favoritos" && !MARCAS.favoritos.size) return vaciar("Aún no hay favoritos. Toca ♡ (o toca dos veces una ficha) para guardarlo aquí.");
  if (!provs) return vaciar("Esta categoría aún no está descargada.");
  const q = $("buscar").value.trim().toLowerCase();
  const region = $("region").value;
  const notaMin = Number($("nota").value);
  const orden = $("orden").value;
  const fotos = $("fotos").value;
  lista = provs.filter((p) =>
    !oculto(p) &&
    (!region || p.region === region) &&
    (!fotos || (fotos === "con") === p.fotos.length > 0) &&
    (Number(p.nota) || 0) >= notaMin &&
    (!q || [p.nombre, p.comuna, p.region, p.descripcion].join(" ").toLowerCase().includes(q))
  );
  const cmp = {
    opiniones: (a, b) => b.n_opiniones - a.n_opiniones || (b.nota || 0) - (a.nota || 0),
    nota: (a, b) => (b.nota || 0) - (a.nota || 0) || b.n_opiniones - a.n_opiniones,
    nombre: (a, b) => a.nombre.localeCompare(b.nombre, "es"),
  }[orden];
  lista.sort(cmp);
  $("cuenta").textContent = `${lista.length} de ${provs.length} proveedores`;
  $("vacio").hidden = lista.length > 0;
  $("vacio").textContent = "Nada coincide con estos filtros.";
  reiniciarGrilla();
  mostrarMas();
}

function tarjeta(p, i) {
  const nota = p.nota ? `<span class="estrellas">${estrellas(p.nota)}</span> ${esc(p.nota)} · ${p.n_opiniones} opiniones` : "Sin opiniones";
  const descartado = MARCAS.descartados.has(p.url);
  const chip = MARCAS.presupuesto.has(p.url) ? "＄ Presupuesto" : descartado ? "Descartado" : "";
  return `<div class="card-wrap${descartado ? " descartado" : ""}" data-url="${esc(p.url)}"${oculto(p) ? " hidden" : ""}><button class="card" data-i="${i}">
    ${p.fotos.length ? imgFoto(p.r2 ? urlR2(p, "portada.webp") : urlFoto(p.fotos[0][0]), "foto") : sinFotos("Sin fotos en el archivo")}
    <div class="cuerpo">
      <h3>${esc(p.nombre)}</h3>
      <div class="meta">${nota}</div>
      <div class="meta">${esc([p.comuna, p.region].filter(Boolean).join(", "))}</div>
      ${p.precio ? `<div class="precio">${esc(p.precio.split("(")[0])}</div>` : ""}
    </div>
  </button>${chip ? `<span class="chip">${chip}</span>` : ""}${corazon(p)}</div>`;
}

function actualizarTarjeta(url) {
  const card = [...document.querySelectorAll(".card-wrap")].find((w) => w.dataset.url === url)?.querySelector(".card");
  if (card) card.parentElement.outerHTML = tarjeta(lista[card.dataset.i], card.dataset.i);
}

const visor = new IntersectionObserver((entradas) => entradas.forEach(({ target: pagina, isIntersecting }) => {
  if (isIntersecting && !pagina.firstChild) {
    pagina.innerHTML = cartas(Number(pagina.dataset.desde));
    pagina.style.height = "";
  } else if (!isIntersecting && pagina.firstChild) {
    pagina.style.height = `${pagina.offsetHeight}px`;
    pagina.innerHTML = "";
  }
}), { rootMargin: `${MARGEN_PX}px 0px` });
new IntersectionObserver(([fin]) => fin.isIntersecting && mostrarMas(), { rootMargin: `${MARGEN_PX}px 0px` }).observe($("fin"));

function cartas(desde) {
  return lista.slice(desde, desde + POR_PAGINA).map((p, k) => tarjeta(p, desde + k)).join("");
}

function reiniciarGrilla() {
  visor.disconnect();
  $("grilla").innerHTML = "";
  mostrados = 0;
}

function mostrarMas() {
  while (mostrados < lista.length && $("fin").getBoundingClientRect().top < innerHeight + MARGEN_PX) {
    const pagina = Object.assign(document.createElement("div"), { className: "pagina", innerHTML: cartas(mostrados) });
    pagina.dataset.desde = mostrados;
    $("grilla").append(pagina);
    visor.observe(pagina);
    mostrados += POR_PAGINA;
  }
}

function numeroWhatsapp(telefono) {
  const movil = telefono.replace(/\D/g, "").match(/^(?:56)?(9\d{8})$/);
  return movil && "56" + movil[1];
}

function enlaceMapa(p) {
  return p.geo && p.geo[0] ? `<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${p.geo[0]},${p.geo[1]}">Ver en el mapa</a>` : "";
}

function enlaceFicha(p) {
  return `<a target="_blank" rel="noopener" href="${ARCHIVO}${p.ts}/${esc(p.url)}">Ver ficha original</a>`;
}

let listaPresupuesto = [];

function pintarPresupuesto() {
  const provs = proveedoresDe();
  vaciar("Aún no hay proveedores en tu presupuesto. Desliza una ficha a la derecha (o toca ＄) para agregarla.");
  $("vacio").hidden = provs.length > 0;
  listaPresupuesto = Object.entries(GRUPOS).flatMap(([, cats]) => provs.filter((p) => categoriaDe(p.url) in cats));
  $("presupuesto").innerHTML = Object.entries(GRUPOS).map(([grupo, cats]) => {
    const items = listaPresupuesto.filter((p) => categoriaDe(p.url) in cats);
    if (!items.length) return "";
    return `<h2>${grupo}</h2>` + items.map((p) => {
      const wa = p.telefono && numeroWhatsapp(p.telefono);
      return `<article class="item-p">
        <div>
          <h3><button class="ver" data-i="${listaPresupuesto.indexOf(p)}">${esc(p.nombre)}</button></h3>
          <div class="meta">${CATEGORIAS[categoriaDe(p.url)]} · ${esc([p.direccion, p.comuna, p.region].filter(Boolean).join(", "))}</div>
          ${p.precio ? `<div class="precio">${esc(p.precio.split("(")[0])}</div>` : ""}
        </div>
        <div class="contacto">
          ${p.telefono ? `<a href="tel:${esc(p.telefono)}">Llamar ${esc(p.telefono)}</a>` : ""}
          ${wa ? `<a target="_blank" rel="noopener" href="https://wa.me/${wa}">WhatsApp</a>` : ""}
          ${enlaceMapa(p)}${enlaceFicha(p)}
        </div>
        <button class="quitar" data-url="${esc(p.url)}">Quitar</button>
      </article>`;
    }).join("");
  }).join("");
}

let pistaVista = false;
try { pistaVista = localStorage.getItem("pista-gestos") === "1"; } catch {}
let cola = [];
let posicion = 0;
let deshacerAccion = null;
let temporizadorAviso = 0;

function abrirEn(nuevaCola, i) {
  cola = nuevaCola;
  posicion = i;
  pintarFicha();
  if (!$("detalle").open) $("detalle").showModal();
}

function pintarFicha() {
  const p = cola[posicion];
  $("detalle").innerHTML = `
    <div class="ficha" id="ficha">
      <div class="sello sello-si" id="sello-si">Presupuesto</div>
      <div class="sello sello-no" id="sello-no">Descartar</div>
      <div class="det-head">
        <div style="flex:1">
          <div class="posicion">${posicion + 1} de ${cola.length}</div>
          <h2>${esc(p.nombre)}</h2>
          <div class="meta">${p.nota ? `<span class="estrellas">${estrellas(p.nota)}</span> ${esc(p.nota)} · ${p.n_opiniones} opiniones · ` : ""}${esc([p.direccion, p.comuna, p.region].filter(Boolean).join(", "))}</div>
          ${p.precio ? `<div class="precio">${esc(p.precio)}</div>` : ""}
        </div>
        <button class="cerrar" aria-label="Cerrar">×</button>
      </div>
      ${p.fotos.length ? `<div class="galeria">${p.fotos.map(([, grande], n) => imgFoto(p.r2 ? urlR2(p, `${n + 1}.webp`) : urlFoto(grande), "")).join("")}</div>` : ""}
      <section class="bloque">
        <div class="links">${enlaceMapa(p)}${enlaceFicha(p)}</div>
        ${p.descripcion || p.faqs.length || p.opiniones.length ? `<details class="mas-info"><summary>Ver más</summary>` : ""}
        ${p.descripcion ? `<h4>Descripción</h4><div class="descripcion">${esc(p.descripcion)}</div>` : ""}
        ${p.faqs.length ? `<h4>Preguntas frecuentes</h4><dl class="faq">${p.faqs.map((f) => `<dt>${esc(f.p)}</dt><dd>${f.r.map(esc).join(" · ")}</dd>`).join("")}</dl>` : ""}
        ${p.opiniones.length ? `<h4>Opiniones (${p.opiniones.length} de ${p.n_opiniones})</h4>${p.opiniones.map((o) => `
          <div class="opinion">
            <div><span class="quien">${esc(o.autor)}</span> <span class="meta">· ${esc(o.fecha)}</span></div>
            <div class="estrellas">${estrellas(o.nota)}</div>
            <div>${esc(o.texto)}</div>
          </div>`).join("")}` : ""}
        ${p.descripcion || p.faqs.length || p.opiniones.length ? "</details>" : ""}
      </section>
    </div>
    <div class="acciones">
      <button class="navegar" data-accion="anterior" aria-label="Proveedor anterior">▲</button>
      <button data-accion="descartar" aria-label="Descartar">✕</button>
      <button data-accion="favorito" aria-label="Favorito">${MARCAS.favoritos.has(p.url) ? "♥" : "♡"}</button>
      <button data-accion="presupuesto" aria-label="Agregar a mi presupuesto">＄</button>
      <button class="navegar" data-accion="siguiente" aria-label="Proveedor siguiente">▼</button>
    </div>
    <div class="pop" id="pop">♥</div>
    ${pistaVista ? "" : `<div class="pista" id="pista">→ presupuesto · ← descartar · 2× favorito · ↕ siguiente</div>`}`;
  $("detalle").scrollTop = 0;
}

function avisar(texto, alDeshacer) {
  deshacerAccion = alDeshacer;
  $("aviso-texto").textContent = texto;
  $("deshacer").hidden = !alDeshacer;
  const aviso = $("aviso");
  if (aviso.matches(":popover-open")) aviso.hidePopover();
  aviso.showPopover?.();
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => aviso.matches(":popover-open") && aviso.hidePopover(), SEGUNDOS_DESHACER * 1000);
}

function poner(url, destino) {
  for (const clave of ["presupuesto", "descartados"]) {
    if (clave === destino) MARCAS[clave].add(url); else MARCAS[clave].delete(url);
    guardarMarca(clave);
  }
  pintarRutas();
  actualizarTarjeta(url);
  if (vista() === "presupuesto") pintarPresupuesto();
}

function marcar(url, destino) {
  const antes = ["presupuesto", "descartados"].find((clave) => MARCAS[clave].has(url));
  poner(url, destino);
  return () => poner(url, antes);
}

function ocultarPista() {
  if (pistaVista) return;
  pistaVista = true;
  try { localStorage.setItem("pista-gestos", "1"); } catch {}
  $("pista")?.remove();
}

function navegar(paso) {
  ocultarPista();
  const destino = posicion + paso;
  if (destino < 0 || destino >= cola.length) return avisar(paso > 0 ? "Es el último de la lista." : "Es el primero de la lista.", null);
  posicion = destino;
  pintarFicha();
  $("ficha").classList.add(paso > 0 ? "desde-abajo" : "desde-arriba");
}

function decidir(accion) {
  ocultarPista();
  if (accion === "siguiente" || accion === "anterior") return navegar(accion === "siguiente" ? 1 : -1);
  const p = cola[posicion];
  if (accion === "favorito") {
    alternarFavorito(p.url);
    const pop = $("pop");
    pop.textContent = MARCAS.favoritos.has(p.url) ? "♥" : "♡";
    pop.classList.remove("on");
    void pop.offsetWidth;
    pop.classList.add("on");
    return;
  }
  const desde = posicion;
  const deshacer = marcar(p.url, accion === "presupuesto" ? "presupuesto" : "descartados");
  avisar(accion === "presupuesto" ? "Agregado a tu presupuesto" : "Descartado", () => {
    deshacer();
    abrirEn(cola, desde);
  });
  volar(accion === "presupuesto" ? 1 : -1);
}

function volar(direccion) {
  const ficha = $("ficha");
  ficha.style.transformOrigin = `50% ${$("detalle").scrollTop + $("detalle").clientHeight / 2}px`;
  ficha.classList.add("volando");
  ficha.style.transform = `translateX(${direccion * 120}vw) rotate(${direccion * 18}deg)`;
  setTimeout(siguiente, 250);
}

function siguiente() {
  if (posicion + 1 < cola.length) {
    posicion += 1;
    pintarFicha();
    return;
  }
  $("detalle").close();
}

let toque = null;
let ultimoToque = 0;

function moverFicha(dx) {
  const umbral = $("ficha").offsetWidth / 3;
  $("ficha").style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
  $("sello-si").style.opacity = Math.min(1, Math.max(0, dx) / umbral);
  $("sello-no").style.opacity = Math.min(1, Math.max(0, -dx) / umbral);
}

$("detalle").addEventListener("pointerdown", (e) => {
  if (!e.target.closest(".ficha") || e.target.closest(".galeria, button, a")) return;
  toque = { id: e.pointerId, x: e.clientX, y: e.clientY, arrastrando: false };
});
$("detalle").addEventListener("pointermove", (e) => {
  if (!toque || e.pointerId !== toque.id || (e.pointerType === "mouse" && !e.buttons)) return;
  const dx = e.clientX - toque.x;
  const dy = e.clientY - toque.y;
  if (!toque.arrastrando) {
    if (Math.abs(dy) > INICIO_ARRASTRE_PX && Math.abs(dy) > Math.abs(dx)) { toque = null; return; }
    if (Math.abs(dx) < INICIO_ARRASTRE_PX) return;
    toque.arrastrando = true;
    $("ficha").classList.remove("volviendo");
    $("ficha").style.transformOrigin = `50% ${$("detalle").scrollTop + $("detalle").clientHeight / 2}px`;
  }
  moverFicha(dx);
});
$("detalle").addEventListener("pointerup", (e) => {
  if (!toque || e.pointerId !== toque.id) return;
  const dx = e.clientX - toque.x;
  const arrastrando = toque.arrastrando;
  toque = null;
  if (arrastrando) {
    if (Math.abs(dx) > $("ficha").offsetWidth / 3) return decidir(dx > 0 ? "presupuesto" : "descartar");
    $("ficha").classList.add("volviendo");
    return moverFicha(0);
  }
  const ahora = Date.now();
  if (ahora - ultimoToque < DOBLE_TOQUE_MS) {
    ultimoToque = 0;
    return decidir("favorito");
  }
  ultimoToque = ahora;
});
$("detalle").addEventListener("pointercancel", () => {
  if (toque?.arrastrando) { $("ficha").classList.add("volviendo"); moverFicha(0); }
  toque = null;
});

const NAVEGAR_PX = 80;
let deslizar = null;

$("detalle").addEventListener("touchstart", (e) => {
  const d = $("detalle");
  deslizar = e.touches.length === 1 && !e.target.closest(".galeria") && {
    x: e.touches[0].clientX,
    y: e.touches[0].clientY,
    arriba: d.scrollTop <= 0,
    abajo: d.scrollTop + d.clientHeight >= d.scrollHeight - 2,
  };
}, { passive: true });
$("detalle").addEventListener("touchend", (e) => {
  if (!deslizar) return;
  const dx = e.changedTouches[0].clientX - deslizar.x;
  const dy = e.changedTouches[0].clientY - deslizar.y;
  if (Math.abs(dy) < NAVEGAR_PX || Math.abs(dy) < Math.abs(dx) * 2) return;
  if (dy < 0 && deslizar.abajo) navegar(1);
  else if (dy > 0 && deslizar.arriba) navegar(-1);
});

document.addEventListener("keydown", (e) => {
  if (!$("detalle").open || e.target.matches?.("input, select, textarea")) return;
  const accion = { ArrowLeft: "descartar", ArrowRight: "presupuesto", ArrowUp: "anterior", ArrowDown: "siguiente", f: "favorito", F: "favorito" }[e.key];
  if (accion) { e.preventDefault(); decidir(accion); }
});

document.addEventListener("click", (e) => {
  const boton = e.target.closest(".corazon");
  if (boton) alternarFavorito(boton.dataset.url);
});
$("grilla").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) abrirEn(lista, Number(card.dataset.i));
});
$("presupuesto").addEventListener("click", (e) => {
  const ver = e.target.closest(".ver");
  if (ver) return abrirEn(listaPresupuesto, Number(ver.dataset.i));
  const quitar = e.target.closest(".quitar");
  if (quitar) avisar("Quitado de tu presupuesto", marcar(quitar.dataset.url, null));
});
$("detalle").addEventListener("click", (e) => {
  if (e.target === $("detalle") || e.target.closest(".cerrar")) return $("detalle").close();
  const accion = e.target.closest("[data-accion]");
  if (accion) decidir(accion.dataset.accion);
});
$("deshacer").addEventListener("click", () => {
  $("aviso").hidePopover();
  deshacerAccion?.();
  deshacerAccion = null;
});
$("filtro-btn").addEventListener("click", () => {
  const abierto = $("opciones").classList.toggle("abierto");
  $("filtro-btn").setAttribute("aria-expanded", abierto);
});
$("categoria").addEventListener("change", mostrar);
window.addEventListener("hashchange", mostrar);
FILTROS.forEach((id) => $(id).addEventListener("input", () => {
  filtrosGuardados = Object.fromEntries(FILTROS.map((f) => [f, $(f).type === "checkbox" ? $(f).checked : $(f).value]));
  try { localStorage.setItem("filtros", JSON.stringify(filtrosGuardados)); } catch {}
  filtrar();
}));

let inicial = CATEGORIA_INICIAL;
try { inicial = localStorage.getItem("categoria") || inicial; } catch {}
try { filtrosGuardados = JSON.parse(localStorage.getItem("filtros")) || {}; } catch {}
FILTROS.filter((id) => id !== "region" && filtrosGuardados[id] != null).forEach((id) => {
  if ($(id).type === "checkbox") $(id).checked = filtrosGuardados[id]; else $(id).value = filtrosGuardados[id];
});
cargarScript(`data/estado.js?v=${Date.now()}`).then(() => {
  pintarEstado();
  $("categoria").innerHTML = Object.entries(GRUPOS)
    .map(([grupo, cats]) => [grupo, Object.keys(cats).filter((k) => estado[k])])
    .filter(([, cats]) => cats.length)
    .map(([grupo, cats]) => `<optgroup label="${grupo}">${cats.map((k) => `<option value="${k}">${CATEGORIAS[k]}</option>`).join("")}</optgroup>`)
    .join("");
  if (estado[inicial]) $("categoria").value = inicial;
  mostrar();
});
</script>
</body>
</html>
